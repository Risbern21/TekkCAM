[package]
name = "tekkcam"
version = "0.1.4"
edition = "2021"
description = "Desktop CNC CAM application"
authors = ["TekkCAM"]

[[bin]]
name = "tekkcam-gui"
path = "src/main.rs"

[[bin]]
name = "tekkcam"
path = "src/bin/tekkcam.rs"

[lib]
name = "tekkcam"
path = "src/lib.rs"

[dependencies]
# UI
eframe = { version = "0.31", features = ["wgpu"] }
egui = "0.31"
egui-wgpu = "0.31"

# GPU
wgpu = "24"
bytemuck = { version = "1", features = ["derive"] }

# Math
glam = "0.29"

# File dialogs
rfd = "0.15"
pollster = "0.4"
serialport = { version = "4.7", default-features = false }
# STEP AP203/AP214/AP242 parsing, B-rep tessellation, and assembly placements (MIT).
oxideav-step = { version = "0.0.1", default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Error handling
anyhow = "1"

# Logging
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
