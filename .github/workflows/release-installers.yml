name: Build installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            formats: nsis
            artifact: windows-x64
          - name: Linux x64
            runner: ubuntu-22.04
            formats: deb,appimage
            artifact: linux-x64
          - name: macOS Apple Silicon
            runner: macos-15
            formats: dmg
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            formats: dmg
            artifact: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const cargo = fs.readFileSync('Cargo.toml', 'utf8');
            const packager = fs.readFileSync('Packager.toml', 'utf8');
            const cargoVersion = cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const packageVersion = packager.match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const tagVersion = context.ref.replace(/^refs\/tags\/v?/, '');
            if (!cargoVersion || cargoVersion !== packageVersion || cargoVersion !== tagVersion) {
              core.setFailed(`Tag (${tagVersion}), Cargo.toml (${cargoVersion}), and Packager.toml (${packageVersion}) versions must match.`);
            }

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libclang-dev \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            pkg-config \
            libfuse2

      - name: Generate macOS application icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p assets/tekkcam.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" assets/icon.png --out "assets/tekkcam.iconset/icon_${size}x${size}.png" >/dev/null
            doubled=$((size * 2))
            sips -z "$doubled" "$doubled" assets/icon.png --out "assets/tekkcam.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns -o assets/icon.icns assets/tekkcam.iconset

      - name: Build release binaries
        run: cargo build --locked --release --bins

      - name: Install Cargo Packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Create installers
        run: cargo packager --release --config Packager.toml --formats "${{ matrix.formats }}"

      - uses: actions/upload-artifact@v7
        with:
          name: TekkCAM-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attach installers to GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
